<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netronex — Coming Soon</title>
    <meta name="description" content="Netronex — Networking services. Coming soon.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: rgba(255, 255, 255, 0.06);
            --text: #e4e4e7;
            --text-muted: #71717a;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* Radial glow behind content */
        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0.6;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 560px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            animation: fadeDown 0.8s ease-out;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            animation: fadeDown 0.8s ease-out 0.1s both;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 300;
            line-height: 1.2;
            letter-spacing: -0.03em;
            margin-bottom: 1.25rem;
            animation: fadeDown 0.8s ease-out 0.2s both;
        }

        h1 strong {
            font-weight: 600;
            background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 3rem;
            font-weight: 300;
            animation: fadeDown 0.8s ease-out 0.3s both;
        }

        .notify-form {
            display: flex;
            gap: 0.5rem;
            max-width: 420px;
            margin: 0 auto;
            animation: fadeDown 0.8s ease-out 0.4s both;
        }

        .notify-form input {
            flex: 1;
            padding: 0.8rem 1.1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .notify-form input::placeholder {
            color: var(--text-muted);
        }

        .notify-form input:focus {
            border-color: var(--accent);
        }

        .notify-form button {
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            white-space: nowrap;
        }

        .notify-form button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .notify-form button:active {
            transform: translateY(0);
        }

        .form-success {
            display: none;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 400;
            max-width: 420px;
            margin: 0 auto;
            animation: fadeDown 0.4s ease-out;
        }

        .form-success.show {
            display: block;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 0.02em;
            z-index: 1;
            animation: fadeDown 0.8s ease-out 0.5s both;
        }

        /* Floating nodes animation */
        .nodes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .node {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: float linear infinite;
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: translateY(-20vh) scale(1);
            }
        }

        @media (max-width: 480px) {
            .notify-form {
                flex-direction: column;
            }

            .notify-form button {
                padding: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating particle nodes -->
    <div class="nodes" id="nodes"></div>

    <div class="container">
        <div class="logo">
            <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="8" r="3" fill="#6366f1"/>
                <circle cx="8" cy="28" r="3" fill="#6366f1"/>
                <circle cx="32" cy="28" r="3" fill="#6366f1"/>
                <circle cx="20" cy="20" r="2.5" fill="#6366f1" opacity="0.5"/>
                <line x1="20" y1="8" x2="8" y2="28" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
                <line x1="20" y1="8" x2="32" y2="28" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
                <line x1="8" y1="28" x2="32" y2="28" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
                <line x1="20" y1="8" x2="20" y2="20" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
                <line x1="8" y1="28" x2="20" y2="20" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
                <line x1="32" y1="28" x2="20" y2="20" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
            </svg>
            <span class="logo-text">netronex</span>
        </div>

        <br>

        <div class="badge">Coming Soon</div>

        <h1>Something <strong>big</strong> is on its way</h1>

        <p class="subtitle">We're building the future of networking. Be the first to know when we launch.</p>

        <form class="notify-form" id="notifyForm">
            <input type="email" placeholder="Enter your email" required autocomplete="email">
            <button type="submit">Notify Me</button>
        </form>

        <p class="form-success" id="formSuccess">You're on the list. We'll be in touch.</p>
    </div>

    <footer>&copy; 2026 Netronex. All rights reserved.</footer>

    <script>
        // Floating nodes
        const nodesContainer = document.getElementById('nodes');
        for (let i = 0; i < 15; i++) {
            const node = document.createElement('div');
            node.className = 'node';
            node.style.left = Math.random() * 100 + '%';
            node.style.animationDuration = (12 + Math.random() * 18) + 's';
            node.style.animationDelay = (Math.random() * 15) + 's';
            node.style.width = node.style.height = (2 + Math.random() * 3) + 'px';
            nodesContainer.appendChild(node);
        }

        // Form handler (placeholder — swap for real backend)
        document.getElementById('notifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            this.style.display = 'none';
            document.getElementById('formSuccess').classList.add('show');
        });
    </script>
</body>
</html>
